<app-auth-layout heading="Đăng nhập" subheading="Chào mừng bạn quay lại! Nhập thông tin để tiếp tục.">
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (endedReason(); as reason) {
      <app-alert kind="warn">{{ reason }}. Vui lòng đăng nhập lại.</app-alert>
    }
    @if (error(); as message) {
      <app-alert kind="error">{{ message }}</app-alert>
    }

    <mat-form-field>
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input matInput type="email" formControlName="email" autocomplete="username" required />
      <mat-error>Nhập email</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Mật khẩu</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input
        matInput
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        required
      />
      <button
        matIconButton
        matSuffix
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        [attr.aria-pressed]="showPassword()"
      >
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Nhập mật khẩu</mat-error>
    </mat-form-field>

    <button matButton="filled" type="submit" class="h-12!" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" class="mr-2 inline-block! align-middle" />
        Đang đăng nhập...
      } @else {
        Đăng nhập
      }
    </button>

    <p class="text-center text-sm text-on-surface-variant">
      Chưa có tài khoản? <a routerLink="/register" class="font-medium">Đăng ký</a>
    </p>

    <div class="mt-4 rounded-xl border border-dashed border-outline-variant p-3 text-xs text-on-surface-variant">
      <div class="mb-1 flex items-center gap-1 font-medium">
        <mat-icon class="size-4! text-base!">science</mat-icon> Môi trường dev
      </div>
      BE chạy profile dev có sẵn tài khoản ADMIN.
      <button matButton type="button" class="ml-1 h-7! px-2! text-xs!" (click)="fillDevAdmin()">
        Điền sẵn admin&#64;example.com
      </button>
    </div>
  </form>
</app-auth-layout>
